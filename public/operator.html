<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBP Vote — Operator</title>
    <link rel="icon" href="/obp-logo.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell operator-shell">
      <header class="brand compact operator-brand">
        <img class="brand-logo compact-logo" src="/obp-logo.png" alt="Off the Beaten Path — An Epic Musical" />
        <div>
          <p class="eyebrow">Off the Beaten Path</p>
          <h1>Vote operator</h1>
          <p class="operator-intro">Control which choice appears, reveal the result, and advance the performance.</p>
        </div>
      </header>
      <section id="operator-login" class="card login-card">
        <label for="operator-key">Operator key</label>
        <div class="inline-control">
          <input id="operator-key" type="password" autocomplete="current-password" />
          <button id="connect" type="button">Connect</button>
        </div>
      </section>
      <section id="operator-panel" class="card" hidden aria-live="polite"></section>
    </main>
    <script type="module" src="/operator.js"></script>
  </body>
</html>
